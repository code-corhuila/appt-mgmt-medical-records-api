version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: appt-medical-records-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medical_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: appt-medical-records-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
